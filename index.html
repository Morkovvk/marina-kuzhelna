    />
    <meta name="author" content="Marina Kuzhelna | Анімаії" />
    <meta

    <header class="header hidden">
      <div class="container">
        <a href="index.html" class="logo">
          <img class="header-image" src="image/logo.JPG" alt="logo" />
          <span data-i18n="header_name">Марина Кужельна</span>
        </a>
        <nav class="header__nav">
          <a class="header_link" href="#" data-i18n="nav_home">Головна</a>
          <a class="header_link" href="#screen1" data-i18n="nav_animations"
            >Анімації</a
          >
          <a class="header_link" href="#contact" data-i18n="nav_contacts"
            >Контакти</a
          >
        </nav>
        <div class="lang-switcher">
          <button class="lang-btn">
            <span class="current-lang">УКР</span>
            <span class="arrow">▾</span>
          </button>

          <ul class="lang-dropdown">
            <li data-lang="uk">УКР</li>
            <li data-lang="en">EN</li>
          </ul>
        </div>
        <button class="menu-icon" type="button">
          <div class="menu-icon__line"></div>
        </button>
      </div>

    <main class="main">
      <section class="welcome">
        <div class="container">
          <div class="welcome__desc">
            <h1 class="welcome__title" data-i18n="hi_1">
              Привіт, я Марина, режисер анімації з Києва
            </h1>
            <p class="welcome__text" data-i18n="p_desc">
              Завдяки анімації ви можете потрапити у свій світ і запросити туди
              друзів!
            </p>
            <a class="btn" href="pages/details.html" data-i18n="b_me"
              >Про мене</a
            >
          </div>
          <img
            src="image/marynaa.jpg"
            alt="photo Maryna"
            class="welcome__img"
          />
        </div>
      </section>

        <div class="container f">
          <h2 class="listing__title" id="gallery-title" data-i18n="galler">
            Мої роботи
          </h2>
          <div class="listing__wrapper">
            <a
              id="the.broken.windows.theory"
              href="pages/tbwt.html"
              class="item-link"
              data-category="the.broken.windows.theory"
            >
              <figure class="listing__img-wrapper">
                <img
                  src="image/the.broken.windows.theory/the.broken.jpg"
                  alt="Теорія розбитих вікон"

            <a

              class="item-link"
              data-category="МУР"

              <figure class="listing__img-wrapper">
                <img src="image/myr/myr.JPG" alt="МУР" />
                <figcaption class="item-label">
                  <h4 data-i18n="name_myr">МУР</h4>
                </figcaption>
              </figure>

            <a
              id="schmalgauzen"

              class="item-link"
              data-category="Schmalgauzen"

              <figure class="listing__img-wrapper">
                <img
                  src="image/schmalgauzen/schmalgauzen.JPG"

                />
                <figcaption class="item-label">
                  <h4>Schmalgauzen</h4>
                </figcaption>
              </figure>
            </a>
            <a
              id="licht"
              href="pages/licht.html"
              class="item-link"
              data-category="Licht"
            >
              <figure class="listing__img-wrapper">
                <img src="image/licht/licht.jpg" alt="Licht" />
                <figcaption class="item-label">
                  <h4>Licht</h4>
                </figcaption>
              </figure>
            </a>
            <a
              id="university"
              href="pages/university.html"
              class="item-link"
              data-category="University"
            >
              <figure class="listing__img-wrapper">
                <img src="image/university/university.jpg" alt="University" />
                <figcaption class="item-label">
                  <h4 data-i18n="name_uni">Університет</h4>
                </figcaption>

            <a
              id="zavirshovani"

              data-category="Zavirshovani"

                  <h4 data-i18n="name_zav">Завіршовані</h4>

              class="item-link"
              data-category="VivienMort"

          <h2 class="title contact_title" data-i18n="contact_tr">
            Для зв'язку
          </h2>
          <a href="mailto:mkuzhelna@gmail.com" class="btn email_btn">Email</a>
          <a
            href="https://www.instagram.com/marinka19.07"
